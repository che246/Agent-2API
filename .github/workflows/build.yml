name: build

# 编译各平台产物并发布到 GitHub Release。
#
# ── 与原版 build.yml 的区别（本仓库是 fork）─────────────────────
# 上游（aimod-cc/Agent2API）的 build.yml **只做派发**：推 tag 后发一条
# `repository_dispatch` 到独立的构建仓库 `Agent2Builder/agent2api-releases`，
# 真正编译在那边的私有 workflow 里跑，签名密钥、iOS 证书、APK keystore 也都在
# 那边的 secrets 里。本仓库没有那套基础设施（也没有 `BUILDER_DISPATCH_TOKEN`），
# 照搬只会得到一条必然失败的 workflow —— 所以这里改成**自包含编译**：
# 直接在 GitHub-hosted runner 上构建并挂 Release。
#
# ── 产出了哪些东西 ────────────────────────────────────────────
#   Windows    桌面端 NSIS 安装包（x64）
#   Linux      服务端包（amd64 / arm64，无 GUI，systemd 形态）+ 桌面端 deb
#   macOS      桌面端 dmg（universal，仅在该 runner 上可出）
#   Android    APK（Capacitor，**未签名 debug 包**，见下方说明）
#   Docker     多架构镜像 → 推送到 GHCR（`ghcr.io/<owner>/<repo>`）
#
# ── 没有做的：macOS 签名公证 / iOS IPA ────────────────────────
# 这两件都需要 Apple 开发者账号与证书 secrets，本仓库没有，硬写只会红。
# macOS 产物因此是**未签名**的 dmg（首次打开需右键 → 打开）；iOS 若要出包，
# 需自行补 `ios` job 与证书 secrets，参照 `desktop-tauri/mobile/ios`。
#
# ── APK 为什么是 debug 签名 ───────────────────────────────────
# 上游把 keystore 与密码移出了仓库（改从本地 `keystore.properties` 读，
# 见 3.1.0 的更新日志）。CI 里没有那份文件，所以这里显式走 `assembleDebug`：
# 产物可安装、可测试，但不能上架。要出正式签名包，在仓库 secrets 里配
# `ANDROID_KEYSTORE_BASE64` / `ANDROID_KEYSTORE_PASSWORD` / `ANDROID_KEY_ALIAS` /
# `ANDROID_KEY_PASSWORD` 后把下面的 `assembleDebug` 换成 `assembleRelease`。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推 `v*` tag            → 构建并**创建 Release**（自动判断预发布）
#   · 手动 workflow_dispatch → 构建，产物作为 workflow artifact 上传（不发 Release）
#
# ── 版本号从哪来 ──────────────────────────────────────────────
# 一律取根 `package.json` 的 `version`（六处版本号的事实来源，见 AGENTS.md）。
# tag 只决定「要不要发 Release」，不参与版本注入 —— 避免 tag 与文件不一致时
# 装出来的包自报另一个版本。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 并上传附件
  packages: write # 推送镜像到 GHCR

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 上游用 sccache 之类会更好，但 GitHub-hosted runner 上 actions/cache 已经够用；
  # 关掉增量以外的噪音，日志更好读。
  RUST_BACKTRACE: 1

jobs:
  # ── 先算一次版本号与是否发版，供各 job 复用 ──────────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 只有 tag 推送才发 Release；手动触发只出 artifact
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          # 版本号里带 `-`（3.3.0-beta.6）即预发布
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "版本 $VERSION（release=$([[ "$GITHUB_REF" == refs/tags/* ]] && echo true || echo false)）"

  # ── Windows 桌面端（NSIS）────────────────────────────────────
  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-tauri/package-lock.json
            desktop-tauri/ui-kit/package-lock.json
            desktop-tauri/ui-islands/package-lock.json
            desktop-tauri/i18n/package-lock.json

      # 网关 crate 声明 rust-version = 1.88（rusqlite 0.40 → libsqlite3-sys 0.38）。
      # 用 stable 即可满足；显式写出来免得到时候 runner 预装的版本太旧。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # workspace 在 desktop-tauri/src-tauri，而 .cargo/config.toml 把
          # target-dir 指到了仓库根的 `target/`。
          workspaces: desktop-tauri/src-tauri -> target

      # 前端产物（ui/islands/ui.js、ui/m/**、ui/i18n/**）是**入库**的，正常不需要
      # 重建。这里仍然装依赖并重建一次：一是保证与源码同源（等价于
      # frontend-artifacts.yml 那道闸，但打包机上多一道保险），二是 ui-kit 的
      # tailwind 解析需要它自己的 node_modules 在位。
      - name: 重建前端产物
        run: |
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/ui-islands ci
          npm --prefix desktop-tauri/i18n ci
          npm --prefix desktop-tauri/ui-islands run build
          npm --prefix desktop-tauri/i18n run build

      - name: 安装 Tauri 依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建桌面端
        run: npm --prefix desktop-tauri run build

      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  # ── Linux：桌面端 deb + 服务端包（两种架构）──────────────────
  linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-tauri/package-lock.json
            desktop-tauri/ui-kit/package-lock.json
            desktop-tauri/ui-islands/package-lock.json
            desktop-tauri/i18n/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      # Tauri 2 在 Linux 上的系统依赖（webkit2gtk-4.1 / gtk3 / libsoup3 …）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev build-essential curl file

      - name: 重建前端产物
        run: |
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/ui-islands ci
          npm --prefix desktop-tauri/i18n ci
          npm --prefix desktop-tauri/ui-islands run build
          npm --prefix desktop-tauri/i18n run build

      - name: 安装 Tauri 依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Linux 桌面端
        run: npm --prefix desktop-tauri run build

      # 服务端形态（无 GUI）：只编 agent2api-server 一个 crate，然后按
      # packaging/linux 的脚本打成一个可直接 install.sh 的 tar.gz。
      # 与 Dockerfile 走同一条 cargo 命令，产物互相可替换。
      #
      # 注意必须 `working-directory: desktop-tauri/src-tauri`：仓库根没有
      # Cargo.toml（workspace 在 src-tauri 下）。用 `--manifest-path` 也能编过，
      # 但 `target-dir = "../../target"` 是相对**该 workspace 的 .cargo/config.toml**
      # 解析的，产物会落到与 Tauri 打包不同的子目录里（run#3 的实际现场：
      # 编译成功，随后 `cp target/release/agent2api-server` 报 No such file）。
      # 直接在 workspace 里跑，target-dir 就与桌面端构建完全一致。
      - name: 构建服务端（amd64）
        working-directory: desktop-tauri/src-tauri
        run: |
          set -euo pipefail
          cargo build --release -p agent2api-server
          cd "$GITHUB_WORKSPACE"
          STAGE="agent2api-server-linux-amd64"
          mkdir -p "dist/$STAGE/ui"
          cp target/release/agent2api-server "dist/$STAGE/"
          cp -r desktop-tauri/ui/. "dist/$STAGE/ui/"
          cp LICENSE "dist/$STAGE/"
          cp -r licenses "dist/$STAGE/"
          cp packaging/linux/agent2api.service packaging/linux/agent2api.env.example \
             packaging/linux/install.sh "dist/$STAGE/"
          tar -czf "dist/$STAGE.tar.gz" -C dist "$STAGE"
          ls -lh "dist/$STAGE.tar.gz"

      - name: 构建服务端（arm64，交叉编译）
        working-directory: desktop-tauri/src-tauri
        run: |
          set -euo pipefail
          # 交叉编译要**目标架构的 C 头文件**，光有链接器（gcc-aarch64-linux-gnu）
          # 不够：ring 等带 C 代码的 crate 会用 aarch64-linux-gnu-gcc 编 .c，
          # 缺 libc6-dev-arm64-cross 时失败在
          #   /usr/include/stdint.h:26: bits/libc-header-start.h: No such file or directory
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release -p agent2api-server --target aarch64-unknown-linux-gnu
          cd "$GITHUB_WORKSPACE"
          STAGE="agent2api-server-linux-arm64"
          mkdir -p "dist/$STAGE/ui"
          cp target/aarch64-unknown-linux-gnu/release/agent2api-server "dist/$STAGE/"
          cp -r desktop-tauri/ui/. "dist/$STAGE/ui/"
          cp LICENSE "dist/$STAGE/"
          cp -r licenses "dist/$STAGE/"
          cp packaging/linux/agent2api.service packaging/linux/agent2api.env.example \
             packaging/linux/install.sh "dist/$STAGE/"
          tar -czf "dist/$STAGE.tar.gz" -C dist "$STAGE"
          ls -lh "dist/$STAGE.tar.gz"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: linux-desktop
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-server
          if-no-files-found: error
          path: dist/*.tar.gz

  # ── macOS 桌面端 dmg（只能在该 runner 上出，无法交叉编译）────
  #
  # `continue-on-error`：macOS runner 在部分账户/时段拿不到（job 不分配 runner，
  # 直接 cancelled、0 step、无日志 —— 本地实测过 run#1 能分配并跑完 13 个 step，
  # 其后几次都拿不到）。那是账户侧的容量问题，与本仓库配置无关，不该让整条
  # 流水线因此变红、连带阻塞 Windows/Linux/Android 的产物发布。
  # 拿到 runner 时它照常产 dmg；拿不到时只影响 dmg 一个产物。
  macos:
    needs: meta
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-tauri/package-lock.json
            desktop-tauri/ui-kit/package-lock.json
            desktop-tauri/ui-islands/package-lock.json
            desktop-tauri/i18n/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: 重建前端产物
        run: |
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/ui-islands ci
          npm --prefix desktop-tauri/i18n ci
          npm --prefix desktop-tauri/ui-islands run build
          npm --prefix desktop-tauri/i18n run build

      - name: 安装 Tauri 依赖
        run: npm --prefix desktop-tauri ci

      # universal dmg：两个 target 编完再合并，与上游发布包同形。
      # 未签名（本仓库没有 Apple 证书），首次打开需右键 →「打开」。
      - name: 构建桌面端（universal）
        run: npm --prefix desktop-tauri run build -- --target universal-apple-darwin
        env:
          # 不签名 / 不公证：显式关掉，免得 tauri 去翻钥匙串然后失败
          APPLE_SIGNING_IDENTITY: '-'

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          if-no-files-found: error
          # 指定 --target 后产物落在**该 target 的子目录**下（不是 target/release），
          # 这是 run#1 里 `target/release/bundle/dmg/*.dmg` 匹配不到的原因。
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.dmg

  # ── Android APK（Capacitor，未签名度见文件头）───────────────
  android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-tauri/mobile/package-lock.json
            desktop-tauri/ui-kit/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：它第一步跑 `sdkmanager tools`，而 Google
      # 已把这个包从 SDK 仓库移除，于是该 action 稳定失败在
      # `Warning: Failed to find package 'tools'` → exit 1（run#1 的实际报错）。
      # ubuntu-latest 镜像自带完整 Android SDK（ANDROID_HOME/ANDROID_SDK_ROOT 已设），
      # 这里只需要补上 Gradle 需要的那几个 platform / build-tools 版本。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # 版本对齐 desktop-tauri/mobile/android/variables.gradle
          # （compileSdk 36 / targetSdk 36 / minSdk 24）
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: 安装手机端依赖并构建 Web 产物
        run: |
          set -euo pipefail
          # ui-kit 也要装：mobile 的 tsconfig 把 `@ui` 指到 `../ui-kit/src`
          # （`paths` 映射），于是 tsc 会**深入 ui-kit 源码**做类型检查，而
          # 那些文件 import 的 `@base-ui/react/*` / `class-variance-authority`
          # 要从 ui-kit 自己的 node_modules 解析。只装 mobile 依赖会得到几十条
          # `TS2307: Cannot find module '@base-ui/react/…'`（run#2 的实际报错），
          # 以及由它连锁出来的 `TS7006: Parameter 'state' implicitly has an 'any' type`。
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/mobile ci
          npm --prefix desktop-tauri/mobile run build:native

      # `cap` 必须在 mobile 目录里跑：它按**当前工作目录**找 capacitor.config.ts
      # 与 android/，用 `npx --prefix desktop-tauri/mobile` 只影响依赖解析、不改
      # cwd，于是它会以为「android 平台还没添加」并以 exit 1 失败（run#3 的实际
      # 报错：`[error] android platform has not been added yet.`）。
      - name: 同步 Capacitor 工程
        working-directory: desktop-tauri/mobile
        run: npx cap sync android

      # debug 签名：CI 里没有上游那份 keystore（它已从仓库移出），
      # 但 debug 包可安装可测试，足够验证；正式包见文件头说明。
      - name: 构建 APK（debug 签名）
        working-directory: desktop-tauri/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 规范产物文件名
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          find desktop-tauri/mobile/android -name '*.apk' -type f -print0 \
            | xargs -0 -I{} cp {} "dist/Agent2API-${VERSION}-universal.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          if-no-files-found: error
          path: dist/*.apk

  # ── Docker 多架构镜像 → GHCR ────────────────────────────────
  docker:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent2api:${{ needs.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/agent2api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 汇总产物并按需发 Release ────────────────────────────────
  # 不把 macos 放进 needs：它可能拿不到 runner（见该 job 的说明），
  # 而 Release 不该因为「少一个 dmg」整体失败。附件用通配 + 
  # fail_on_unmatched_files: false 兜住 dmg 缺失。
  release:
    needs: [meta, windows, linux, android]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # 用 pattern 只取真正要发布的产物。不能「下载全部」：docker job 用 gha
      # 缓存时会顺带留下一个 `che246~Agent-2API~WNS434.dockerbuild` 产物，
      # 它不是普通文件包，download-artifact 解压它会连续重试 5 次后失败
      # （run#6 的实际报错：`Artifact download failed after 5 retries` /
      # `digest-mismatch`）。
      #
      # `pattern` 是**单个 glob**（不是列表）。用 `*-*` 会连 dockerbuild 一起命中，
      # 所以这里用「含连字符、且不以 .dockerbuild 结尾」的显式组合不成立 ——
      # 改用一个能覆盖五个产物的精确集合：download-artifact 支持 `{a,b}` 花括号
      # 展开（minimatch 语法）。
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: '{windows-nsis,linux-desktop,linux-server,android-apk,macos-universal}'

      - name: 产物清单
        run: ls -lR dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Agent2API ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          # 更新日志就是 tag 指向提交的提交信息（与本仓库既有发版约定一致）
          body: |
            Agent2API ${{ needs.meta.outputs.version }}

            自动构建产物（Windows / Linux 桌面端与服务端 / macOS dmg / Android APK）。
            Docker 镜像：`ghcr.io/${{ github.repository_owner }}/agent2api:${{ needs.meta.outputs.version }}`

            - macOS 的 dmg **未签名 / 未公证**，首次打开请右键 →「打开」。
            - Android 的 APK 为 **debug 签名**，仅供测试，不用于上架。
          files: |
            dist/*.exe
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.apk
          fail_on_unmatched_files: false
